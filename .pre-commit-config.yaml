repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        exclude: .yarn
      - id: trailing-whitespace
        exclude: .yarn

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint-fix
        name: markdownlint-fix
        description: "Fixes the style of Markdown/Commonmark files."
        entry: markdownlint --fix -c .markdownlint.yaml
        language: node
        types: [markdown]
        # docs/ is hand-transcribed course content (Docusaurus MDX with
        # :::admonition::: directives, embedded JSX/SVG, KaTeX) verified
        # against source PDFs — a generic markdown fixer doesn't understand
        # any of that and can silently alter content (e.g. stripping `$`
        # shell-prompt prefixes from code blocks). Exclude it; only lint
        # non-doc markdown (READMEs, etc.).
        exclude: ^docs/
        minimum_pre_commit_version: 0.15.0

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ["--severity=style"]

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: yarn format
        language: system
        types: [file, javascript]
        pass_filenames: false

  # generate_slugs and generate_contributors were removed from the active
  # hook set: both are mutating generator scripts, not linters, and don't
  # belong in a blocking CI gate.
  #   - generate_slugs writes a `slug:` frontmatter field to every doc based
  #     on its file path — a real site-structure/URL decision that needs a
  #     deliberate one-time run + review, not silent CI auto-fix.
  #   - generate_contributors needs a GH_TOKEN (not configured anywhere in
  #     this workflow) and still has an unfixed "YOUR_GITHUB_USERNAME"
  #     placeholder in its command — it has never been able to succeed in CI.
  # Run either manually (`python scripts/generate_slugs.py`, or fix+export
  # GH_TOKEN for the contributors command) if/when you actually want their
  # output, then commit the result deliberately.